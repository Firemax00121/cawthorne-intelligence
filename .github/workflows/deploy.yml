name: Deploy Cawthorne Intelligence

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '10 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Stamp current terminal date and verified Brent reference
        shell: bash
        run: |
          export CURRENT_DATE=$(TZ=America/Chicago date '+%d %b %Y' | tr '[:lower:]' '[:upper:]')
          export CURRENT_UTC=$(TZ=UTC date '+%H:%M UTC')
          python3 - <<'PY'
          from pathlib import Path
          import os, re, json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          current_date = os.environ['CURRENT_DATE']
          current_utc = os.environ['CURRENT_UTC']
          s = re.sub(
              r'<span>\d{2} [A-Z]{3} \d{4}</span><span>\d{2}:\d{2} UTC</span>',
              f'<span>{current_date}</span><span>{current_utc}</span>',
              s,
              count=1,
          )

          md = Path('market-data.json')
          if md.exists():
              data = json.loads(md.read_text(encoding='utf-8'))
              brent = data.get('brent', {})
              price = str(brent.get('price', '')).strip()
              verified_date = str(brent.get('verified_date', '')).strip().upper()
              source_label = str(brent.get('source_label', 'Verified public source')).strip()
              status_label = str(brent.get('status_label', 'OBSERVED')).strip().upper()
              if price and verified_date:
                  replacement = (
                      f'<div class="tick" id="brentTicker"><div class="k">BRENT · LAST VERIFIED {verified_date}</div>'
                      f'<div class="v">${price}</div><div class="sub"><span>{source_label}</span>'
                      f'<span class="tag observed">{status_label}</span></div></div>'
                  )
                  s, n = re.subn(
                      r'<div class="tick"(?: id="brentTicker")?><div class="k">BRENT · LAST VERIFIED[^<]*</div><div class="v">\$[^<]+</div><div class="sub"><span>[^<]*</span><span[^>]*>[^<]*</span></div></div>',
                      replacement,
                      s,
                      count=1,
                  )
                  if n != 1:
                      raise SystemExit('Brent ticker injection failed: expected exactly one matching ticker.')

          live_script = '''<script>
          (function(){
            fetch('/market-data.json?v=' + Date.now(), {cache:'no-store'})
              .then(function(r){ if(!r.ok) throw new Error('market data unavailable'); return r.json(); })
              .then(function(data){
                var b = data && data.brent;
                var t = document.getElementById('brentTicker');
                if(!b || !t || !b.price || !b.verified_date) return;
                t.querySelector('.k').textContent = 'BRENT · LAST VERIFIED ' + String(b.verified_date).toUpperCase();
                t.querySelector('.v').textContent = '$' + String(b.price);
                var spans = t.querySelectorAll('.sub span');
                if(spans[0]) spans[0].textContent = b.source_label || 'Verified public source';
                if(spans[1]) spans[1].textContent = (b.status_label || 'OBSERVED').toUpperCase();
              })
              .catch(function(){});
          })();
          </script>'''
          if 'market-data.json?v=' not in s:
              s = s.replace('</body>', live_script + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
